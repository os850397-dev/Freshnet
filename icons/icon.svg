# Freshnet

Freshnet est un mini réseau social front-end pensé comme prototype PWA pour GitHub Pages.

## Pages
- `index.html` : page d'accueil
- `connexion.html` : formulaire login / inscription
- `fil.html` : fil d'actualités local

## Fonctionnement
- Authentification locale via `localStorage`
- Publications stockées localement
- Manifest PWA + service worker pour un comportement d'application installable

## Déploiement
Le site est prêt pour un hébergement GitHub Pages.

## Remarque
Ceci est un prototype front-end sans backend distant.


<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Freshnet — Connecter le monde, rapprocher les personnes.">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Freshnet — Connexion</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="index.html"><span class="brand-mark">F</span>Fresh<span>net</span></a>
    <div class="tabs" role="tablist" aria-label="Authentification">
      <button class="tab active" id="tabLogin" type="button" role="tab" aria-selected="true" aria-controls="loginForm">Connexion</button>
      <button class="tab" id="tabSignup" type="button" role="tab" aria-selected="false" aria-controls="signupForm">Créer un compte</button>
    </div>
    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" required autocomplete="email">
      <label for="loginPassword">Mot de passe</label>
      <input type="password" id="loginPassword" required autocomplete="current-password">
      <button class="gold-button" type="submit">Se connecter</button>
    </form>
    <form id="signupForm" hidden>
      <label for="signupUsername">Nom d'utilisateur</label>
      <input type="text" id="signupUsername" required minlength="3" maxlength="24" autocomplete="username">
      <label for="signupEmail">Email</label>
      <input type="email" id="signupEmail" required autocomplete="email">
      <label for="signupPassword">Mot de passe (6 caractères minimum)</label>
      <input type="password" id="signupPassword" required minlength="6" autocomplete="new-password">
      <button class="gold-button" type="submit">Créer mon compte</button>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    window.FreshnetConfig = {
      supabaseUrl: 'https://klkcjtqqodeicqbgxfaa.supabase.co',
      supabaseKey: 'sb_publishable_32Njy0xIgW5-gKmIwRG96w_KsJF9BW9'
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-page.js"></script>
</body>
</html>

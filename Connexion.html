<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freshnet — Connexion</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="index.html"><span class="brand-mark">F</span>Fresh<span>net</span></a>

    <div class="tabs" role="tablist">
      <button class="tab active" id="tabLogin" role="tab" type="button">Connexion</button>
      <button class="tab" id="tabSignup" role="tab" type="button">Créer un compte</button>
    </div>

    <form id="loginForm">
      <label>Email
        <input type="email" id="loginEmail" required autocomplete="email">
      </label>
      <label>Mot de passe
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </label>
      <button class="gold-button" type="submit">Se connecter</button>
    </form>

    <form id="signupForm" hidden>
      <label>Nom d'utilisateur
        <input type="text" id="signupUsername" required minlength="3" maxlength="24" autocomplete="username">
      </label>
      <label>Email
        <input type="email" id="signupEmail" required autocomplete="email">
      </label>
      <label>Mot de passe (6 caractères minimum)
        <input type="password" id="signupPassword" required minlength="6" autocomplete="new-password">
      </label>
      <button class="gold-button" type="submit">Créer mon compte</button>
    </form>

    <p id="message" class="message" role="status"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
